name: Build The Daily Shop APK

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'codemagic.yaml'
      - '.github/workflows/build-android-apk.yml'
  # Manual dispatch is enabled; this comment-only change triggers a fresh validation build.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-shop-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: the-daily-shop-development

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Run unit tests
        run: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          /tmp/gradle-8.9/bin/gradle --no-daemon clean testDebugUnitTest

      - name: Detect configured release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build permanently signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ vars.APP_VERSION_NAME }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/the-daily-shop-release.jks"
          test -s "$RUNNER_TEMP/the-daily-shop-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/the-daily-shop-release.jks"
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_KIND=stable-release-signed" >> "$GITHUB_ENV"

      - name: Build development debug APK (not suitable for upgrading release installs)
        if: ${{ env.HAS_RELEASE_SIGNING != 'true' }}
        env:
          APP_VERSION_NAME: ${{ vars.APP_VERSION_NAME }}
        run: |
          set -e
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_KIND=debug-development-only" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-daily-shop-${{ env.APK_KIND }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
