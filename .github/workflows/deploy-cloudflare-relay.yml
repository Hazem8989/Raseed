name: Deploy The Daily Shop Cloudflare Relay

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - 'cloudflare-relay/**'
      - '.github/workflows/deploy-cloudflare-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-shop-relay-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/the-daily-shop-development'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - name: Checkout development branch only
        uses: actions/checkout@v4
        with:
          ref: the-daily-shop-development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check relay
        run: npm run check

      - name: Integration tests
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 210s npm run test:integration

      - name: Deploy Worker with the provisioned public trust root
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STORE_ROOT_PUBLIC_KEYS: ${{ secrets.STORE_ROOT_PUBLIC_KEYS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$STORE_ROOT_PUBLIC_KEYS" ]; then
            echo "Required deployment secret is missing."
            exit 1
          fi
          npx wrangler deploy --var "STORE_ROOT_PUBLIC_KEYS:$STORE_ROOT_PUBLIC_KEYS"

      - name: Verify deployed Worker health endpoint
        env:
          RELAY_URL: https://the-daily-shop-relay.hazem-syrian.workers.dev
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \
            "$RELAY_URL/healthz" --output "$response_file"
          node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (body.service !== "the-daily-shop-relay" || body.status !== "ok" || body.protocol !== 2) {
              throw new Error("Unexpected relay health response");
            }
            console.log("Relay health verified: service=the-daily-shop-relay status=ok protocol=2");
          ' "$response_file"

      - name: Verify deployed public trust roots
        env:
          RELAY_URL: https://the-daily-shop-relay.hazem-syrian.workers.dev
          STORE_ROOT_PUBLIC_KEYS: ${{ secrets.STORE_ROOT_PUBLIC_KEYS }}
        run: |
          node --input-type=module <<'NODE'
          const roots = JSON.parse(process.env.STORE_ROOT_PUBLIC_KEYS);
          if (!roots || typeof roots !== "object" || Array.isArray(roots) || Object.keys(roots).length === 0) {
            throw new Error("STORE_ROOT_PUBLIC_KEYS must be a non-empty JSON object.");
          }
          for (const [storeId, expected] of Object.entries(roots)) {
            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(storeId)) {
              throw new Error("A configured store key has an invalid store UUID.");
            }
            if (!expected || typeof expected.device_id !== "string" || typeof expected.public_key !== "string") {
              throw new Error("A configured trust root is missing required public fields.");
            }
            const response = await fetch(`${process.env.RELAY_URL}/v1/trust/${storeId}`);
            if (!response.ok) {
              throw new Error(`Trust endpoint returned HTTP ${response.status} for a configured store.`);
            }
            const actual = await response.json();
            if (actual.store_id !== storeId || actual.device_id !== expected.device_id || actual.public_key !== expected.public_key || actual.algorithm !== "EC_P256_SHA256") {
              throw new Error("The deployed trust root does not match the configured public trust root.");
            }
            console.log(`Trust root verified for configured store ${storeId}.`);
          }
          console.log(`Verified ${Object.keys(roots).length} deployed public trust root(s).`);
          NODE
