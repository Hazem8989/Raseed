name: Process and export branding images
on:
  push:
    branches:
      - the-daily-shop-development
permissions:
  contents: write
jobs:
  process:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: the-daily-shop-development
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove checkerboard and install Android branding resources
        run: |
          python -m pip install --quiet pillow numpy opencv-python-headless
          python - <<'PY'
          from PIL import Image, ImageDraw
          import numpy as np, cv2, os
          path = "branding_logo.png"
          image = Image.open(path).convert("RGBA")
          arr = np.array(image)
          rgb = arr[:, :, :3]
          maximum = rgb.max(axis=2).astype(np.int16)
          minimum = rgb.min(axis=2).astype(np.int16)
          saturation = maximum - minimum
          value = rgb.mean(axis=2)
          alpha = np.where((saturation <= 13) & (value >= 38) & (value <= 216), 0, 255).astype(np.uint8)
          background = (alpha == 0).astype(np.uint8)
          count, labels, stats, _ = cv2.connectedComponentsWithStats(background, 8)
          for i in range(1, count):
              x, y, w, h, area = stats[i]
              touches_edge = x == 0 or y == 0 or x + w >= alpha.shape[1] or y + h >= alpha.shape[0]
              if not touches_edge and area < 1000:
                  alpha[labels == i] = 255
          alpha = cv2.GaussianBlur(alpha, (3, 3), 0.55)
          arr[:, :, 3] = alpha
          logo = Image.fromarray(arr, "RGBA")
          logo.save(path, optimize=True)
          print("Transparent pixels:", int((alpha == 0).sum()))
          print("Corner alpha values:", [int(alpha[y, x]) for x, y in [(0,0),(alpha.shape[1]-1,0),(0,alpha.shape[0]-1),(alpha.shape[1]-1,alpha.shape[0]-1)]])
          assert all(alpha[y, x] == 0 for x, y in [(0,0),(alpha.shape[1]-1,0),(0,alpha.shape[0]-1),(alpha.shape[1]-1,alpha.shape[0]-1)])
          assert int((alpha == 0).sum()) > 500000
          res = "app/src/main/res"
          os.makedirs(res + "/drawable-nodpi", exist_ok=True)
          logo.save(res + "/drawable-nodpi/daily_shop_logo.png", optimize=True)
          logo.save(res + "/drawable-nodpi/daily_shop_basket.png", optimize=True)
          Image.open("branding_splash.png").convert("RGBA").save(res + "/drawable-nodpi/the_daily_shop_splash.png", optimize=True)
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              canvas = Image.new("RGBA", (size,size), (24,75,55,255))
              fg = logo.copy()
              fg.thumbnail((int(size*0.76), int(size*0.76)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(fg, ((size-fg.width)//2,(size-fg.height)//2))
              folder = f"{res}/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              canvas.save(f"{folder}/ic_launcher.png", optimize=True)
          PY
      - name: Commit branding resources to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branding_logo.png app/src/main/res
          if ! git diff --cached --quiet; then
            git commit -m "Install transparent branding assets and launcher icons"
            git push origin HEAD:the-daily-shop-development
          fi
      - name: Package branding images
        run: |
          test -s branding_splash.png
          test -s branding_logo.png
          mkdir -p export
          cp branding_splash.png branding_logo.png export/
          cd export
          zip -9 ../branding-images.zip branding_splash.png branding_logo.png
      - name: Upload temporary archive
        uses: actions/upload-artifact@v4
        with:
          name: branding-images
          path: branding-images.zip
          retention-days: 1
