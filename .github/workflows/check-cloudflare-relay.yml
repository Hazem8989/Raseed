name: Validate Cloudflare Sync Relay

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - 'cloudflare-relay/**'
      - 'app/**'
      - 'app/src/main/java/com/hazem/dailystore/data/Sync*.kt'
      - 'app/src/test/java/com/hazem/dailystore/data/Sync*.kt'
      - 'app/src/test/java/com/hazem/dailystore/data/TwoDeviceSyncIntegrationTest.kt'
      - '.github/workflows/check-cloudflare-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-shop-relay-check
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - uses: actions/checkout@v4
        with:
          ref: the-daily-shop-development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-relay/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check relay
        run: npm run check
      - name: Test two independent WebSocket devices
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 150s npm run test:integration
