name: SQLCipher Android Instrumentation

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - "app/**"
      - ".github/workflows/sqlcipher-instrumentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcipher-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlcipher-instrumentation:
    name: Verify SQLCipher on Android runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64"

      - name: Run SQLCipher instrumentation test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail
            REPORT_DIR="app/build/reports/sqlcipher-instrumentation"
            mkdir -p "$REPORT_DIR"
            trap 'adb logcat -d -t 4000 > "$REPORT_DIR/logcat.txt" 2>/dev/null || true' EXIT

            /tmp/gradle-8.9/bin/gradle --no-daemon \
              :app:assembleDebug \
              :app:assembleDebugAndroidTest \
              --stacktrace

            adb wait-for-device
            for attempt in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            # Install explicitly without ADB streaming to avoid the flaky
            # ddmlib/UTP install-write path seen on the hosted emulator.
            adb install --no-streaming -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install --no-streaming -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            set +e
            adb shell am instrument -w -r \
              com.hazem.dailystore.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee "$REPORT_DIR/instrumentation.txt"
            instrumentation_status=${PIPESTATUS[0]}
            set -e

            if [ "$instrumentation_status" -ne 0 ]; then
              echo "Instrumentation command failed with exit code $instrumentation_status"
              exit "$instrumentation_status"
            fi
            if ! grep -Eq 'OK \\([1-9][0-9]* tests?\\)' "$REPORT_DIR/instrumentation.txt"; then
              echo "Instrumentation did not report a passing test count."
              exit 1
            fi

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/sqlcipher-instrumentation/
          if-no-files-found: ignore
