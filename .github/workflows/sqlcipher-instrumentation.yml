name: SQLCipher Android Instrumentation

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - "app/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/sqlcipher-instrumentation.yml"
      - ".github/scripts/run-sqlcipher-instrumentation.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcipher-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlcipher-instrumentation:
    name: Verify SQLCipher - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    # The complete pipeline suite previously passed close to the 45-minute ceiling.
    # Leave headroom for emulator and Gradle cold-start variance.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Run one AVD at a time: concurrent emulator boots have stalled framework startup
      # on hosted runners, leaving instrumentation jobs waiting before tests begin.
      max-parallel: 1
      matrix:
        suite:
          - core
          - coordinator
          - startup_barrier
          - end_to_end
          - pipeline
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 --retry-max-time 180 https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Install Android Emulator host libraries
        run: |
          sudo apt-get update
          # Ubuntu 24.04 ships PulseAudio runtime as the t64 package.
          # The Android Emulator QEMU binary links against libpulse.so.0.
          sudo apt-get install --yes libpulse0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager exits normally after consuming the final "y"; the yes
          # producer may receive SIGPIPE. Ignore pipefail only for this license pipe,
          # while still propagating sdkmanager failures through its exit status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          # Install stable SDK components separately so a transient emulator archive
          # failure cannot force needless redownloads of the platform and system image.
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "system-images;android-34;default;x86_64"

          # The emulator package download can occasionally be truncated/corrupted by
          # the upstream CDN or runner network. Retry only this package, preserve each
          # attempt's log, and clear SDK Manager's temporary extraction cache between
          # attempts. Do not bypass package verification or use an unverified archive.
          emulator_installed=false
          for attempt in 1 2 3 4; do
            echo "Installing Android Emulator package (attempt $attempt/4)"
            if "$SDKMANAGER" --verbose "emulator" 2>&1 | tee "/tmp/sdkmanager-emulator-attempt-$attempt.log"; then
              emulator_installed=true
              break
            fi

            if ! grep -Eqi "unknown archive|ZipFile|corrupt|unexpected end|failed to install" "/tmp/sdkmanager-emulator-attempt-$attempt.log"; then
              echo "Android Emulator installation failed for a non-retryable reason; see attempt log." >&2
              exit 1
            fi

            echo "Detected a damaged/incomplete SDK download or extraction; clearing temporary SDK Manager cache before retry."
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/temp"
            sleep 15
          done

          if [ "$emulator_installed" != true ]; then
            echo "Android Emulator package could not be installed after four verified retries." >&2
            exit 1
          fi

          "$ANDROID_HOME/emulator/emulator" -version

      - name: Build instrumentation APKs before emulator startup
        run: |
          /tmp/gradle-8.9/bin/gradle --no-daemon --max-workers=2 \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --stacktrace

      - name: Run isolated SQLCipher suite on minimal AOSP emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          # The previous 4-vCPU/4-GiB AVD booted for 7.7 minutes, then
          # settings/input binder calls returned Broken pipe before the test
          # script started. Use a smaller guest footprint and non-indirect
          # software rendering to reduce host/guest contention on hosted runners.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/run-sqlcipher-instrumentation.sh "${{ matrix.suite }}"

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-instrumentation-${{ matrix.suite }}-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/sqlcipher-instrumentation/
          if-no-files-found: ignore
