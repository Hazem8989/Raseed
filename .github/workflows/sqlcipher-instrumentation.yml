name: SQLCipher Android Instrumentation

on:
  push:
    branches:
      - the-daily-shop-development
    paths:
      - "app/**"
      - ".github/workflows/sqlcipher-instrumentation.yml"
      - ".github/scripts/run-sqlcipher-instrumentation.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlcipher-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlcipher-instrumentation:
    name: Verify SQLCipher - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - core
          - coordinator
          - end_to_end
          - pipeline
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "system-images;android-34;default;x86_64"

      - name: Run isolated SQLCipher suite on lightweight AOSP emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/run-sqlcipher-instrumentation.sh "${{ matrix.suite }}"

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-instrumentation-${{ matrix.suite }}-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/reports/sqlcipher-instrumentation/
          if-no-files-found: ignore
