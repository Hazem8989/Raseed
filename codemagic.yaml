workflows:
  the-daily-shop-android:
    name: The Daily Shop Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Prepare Gradle
        script: |
          set -e
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build The Daily Shop APK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
