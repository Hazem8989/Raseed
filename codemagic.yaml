
workflows:
  raseed-android:
    name: Raseed Manager APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract project
        script: |
          unzip -q RaseedManagerAndroid.zip -d source

      - name: Build APK
        script: |
          cd source/RaseedManagerAndroid
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug

    artifacts:
      - source/RaseedManagerAndroid/app/build/outputs/apk/**/*.apk
