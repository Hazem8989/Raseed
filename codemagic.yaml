
workflows:
  raseed-android:
    name: Raseed Manager APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract project
        script: |
          unzip -q RaseedManagerAndroid.zip -d source

      - name: Build APK
        script: |
          cd source/RaseedManagerAndroid

          echo "Fixing Java and Kotlin compatibility..."
          perl -0pi -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts

          echo "Checking Java configuration..."
          grep -n -E 'sourceCompatibility|targetCompatibility|jvmTarget' app/build.gradle.kts || true

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Downloading Gradle..."
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip

          echo "Extracting Gradle..."
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

          echo "Building APK..."
          /tmp/gradle-8.9/bin/gradle assembleDebug

    artifacts:
      - source/RaseedManagerAndroid/app/build/outputs/apk/**/*.apk
