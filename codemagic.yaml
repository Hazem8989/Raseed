
workflows:
  raseed-android:
    name: Raseed Manager APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract project
        script: |
          unzip -q RaseedManagerAndroid.zip -d source

      - name: Build APK
        
      - name: Build APK
        script: |
          cd source/RaseedManagerAndroid
          sed -i 's/VERSION_1_8/VERSION_17/g; s/"1.8"/"17"/g' app/build.gradle.kts
          echo "----- Java and Kotlin settings -----"
          grep -n -E 'compileOptions|sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8|VERSION_17' app/build.gradle.kts
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          /tmp/gradle-8.9/bin/gradle assembleDebug

    artifacts:
      - source/RaseedManagerAndroid/app/build/outputs/apk/**/*.apk
